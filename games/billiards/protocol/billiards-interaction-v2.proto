syntax = "proto3";

package slop.billiards.v2;

message Vector2 {
  sint32 x = 1;
  sint32 y = 2;
}

enum InteractionKind {
  INTERACTION_KIND_UNSPECIFIED = 0;
  INTERACTION_KIND_AIM_PREVIEW = 1;
  INTERACTION_KIND_AIM_LOCKED = 2;
  INTERACTION_KIND_AIM_UNLOCKED = 3;
  INTERACTION_KIND_CUE_PLACEMENT_PREVIEW = 4;
  INTERACTION_KIND_MANUAL_STROKE = 5;
  INTERACTION_KIND_RESET = 6;
}

message InteractionIntent {
  uint32 schema_version = 1;
  InteractionKind kind = 2;
  uint32 match_revision = 3;
  uint32 client_sequence = 4;
  sint32 angle_microradians = 5;
  Vector2 placement_position = 6;
  bool placement_valid = 7;
  sint32 cue_offset_millipixels = 8;
  uint32 pullback_millipixels = 9;
  uint32 forward_velocity_millipixels_per_second = 10;
  uint32 power_millionths = 11;
}

message InteractionBroadcast {
  string session_id = 1;
  InteractionIntent intent = 2;
}
