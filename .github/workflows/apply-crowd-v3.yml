name: Apply Parking Jam crowd patch

on:
  push:
    branches:
      - feature/core-traffic
    paths:
      - .github/workflows/apply-crowd-v3.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-parking-jam-crowd-v3
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/core-traffic
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Decode generated source and assets
        shell: bash
        run: |
          set -euo pipefail
          echo "Applying archive revision 2"
          wc -c .slop-patch/crowd-v3/part-*
          python3 - <<'PY'
          import base64
          import glob
          import hashlib
          import pathlib

          parts = [pathlib.Path(path) for path in sorted(glob.glob('.slop-patch/crowd-v3/part-*'))]
          encoded = ''.join(
              ''.join(part.read_text(encoding='utf-8').split())
              for part in parts
          )
          invalid = sorted(set(encoded) - set('ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/='))
          print(f'encoded length: {len(encoded)}')
          print(f'invalid characters: {invalid!r}')
          decoded = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(decoded).hexdigest()
          print(f'decoded sha256: {digest}')
          expected = '1d1477aa8c82de52ec3932475d57562ea0d36c822b8e2376940f4a440841db11'
          if digest != expected:
              raise SystemExit(f'archive hash mismatch: expected {expected}')
          pathlib.Path('/tmp/crowd-v3.tar.gz').write_bytes(decoded)
          PY
          tar -xzf /tmp/crowd-v3.tar.gz

          test -f games/traffic-jam/runtime/presentation/app.ts
          test -f games/traffic-jam/runtime/presentation/scene.ts
          test -f games/traffic-jam/runtime/assets/models/compact-car.glb
          test -f games/traffic-jam/runtime/assets/models/passenger.glb
          test "$(od -An -tx1 -N4 games/traffic-jam/runtime/assets/models/compact-car.glb | tr -d ' \n')" = "676c5446"
          test "$(od -An -tx1 -N4 games/traffic-jam/runtime/assets/models/passenger.glb | tr -d ' \n')" = "676c5446"

      - name: Verify domain and architecture
        run: npm run check

      - name: Commit applied patch and clean staging files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "slop-patch-bot"
          git config user.email "actions@users.noreply.github.com"

          git add \
            games/traffic-jam/runtime/presentation/app.ts \
            games/traffic-jam/runtime/presentation/scene.ts \
            games/traffic-jam/runtime/assets \
            tools/generate-traffic-assets.py
          git rm -r .slop-patch/crowd-v3
          git rm .github/workflows/apply-crowd-v3.yml

          if git diff --cached --quiet; then
            echo "No patch changes to commit."
            exit 0
          fi

          git commit -m "feat: add crowd boarding, shuffled lots, locations, and source models"
          git push origin HEAD:feature/core-traffic
