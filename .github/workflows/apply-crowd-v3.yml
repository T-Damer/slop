name: Apply crowd and location patch

on:
  push:
    branches:
      - feature/core-traffic
    paths:
      - .slop-patch/crowd-v3/**
      - .github/workflows/apply-crowd-v3.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-crowd-v3
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/core-traffic
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Decode application and scene patch
        shell: bash
        run: |
          set -euo pipefail
          cat .slop-patch/crowd-v3/part-* \
            | base64 --decode \
            | tar --extract --gzip

      - name: Validate the completed patch
        run: npm run check

      - name: Commit the completed patch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .slop-patch/crowd-v3
          rm .github/workflows/apply-crowd-v3.yml
          git config user.name "Slop validation bot"
          git config user.email "actions@users.noreply.github.com"
          git add games/traffic-jam/runtime/presentation/app.ts \
                  games/traffic-jam/runtime/presentation/scene.ts \
                  .slop-patch \
                  .github/workflows/apply-crowd-v3.yml
          git commit -m "feat: animate passenger crowds and randomized locations"
          git push origin HEAD:feature/core-traffic
