name: Apply Parking Jam crowd patch

on:
  push:
    branches:
      - feature/core-traffic
    paths:
      - .github/workflows/apply-crowd-v3.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-parking-jam-crowd-v3
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/core-traffic
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Decode generated source and assets
        shell: bash
        run: |
          set -euo pipefail
          cat .slop-patch/crowd-v3/part-* | tr -d '\n' | base64 --decode > "${RUNNER_TEMP}/crowd-v3.tar.gz"
          tar -xzf "${RUNNER_TEMP}/crowd-v3.tar.gz"

          test -f games/traffic-jam/runtime/presentation/app.ts
          test -f games/traffic-jam/runtime/presentation/scene.ts
          test -f games/traffic-jam/runtime/assets/models/compact-car.glb
          test -f games/traffic-jam/runtime/assets/models/passenger.glb
          test "$(xxd -p -l 4 games/traffic-jam/runtime/assets/models/compact-car.glb)" = "676c5446"
          test "$(xxd -p -l 4 games/traffic-jam/runtime/assets/models/passenger.glb)" = "676c5446"

      - name: Verify domain and architecture
        run: npm run check

      - name: Commit applied patch and clean staging files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "slop-patch-bot"
          git config user.email "actions@users.noreply.github.com"

          git add \
            games/traffic-jam/runtime/presentation/app.ts \
            games/traffic-jam/runtime/presentation/scene.ts \
            games/traffic-jam/runtime/assets \
            tools/generate-traffic-assets.py
          git rm -r .slop-patch/crowd-v3
          git rm .github/workflows/apply-crowd-v3.yml

          if git diff --cached --quiet; then
            echo "No patch changes to commit."
            exit 0
          fi

          git commit -m "feat: add crowd boarding, shuffled lots, locations, and source models"
          git push origin HEAD:feature/core-traffic
