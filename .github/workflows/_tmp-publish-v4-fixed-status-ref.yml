name: Temporary publish fixed Pocket Club v4 status ref

on:
  push:
    branches: ["docs/agent-foundation"]
    paths: [".github/workflows/_tmp-publish-v4-fixed-status-ref.yml"]

permissions:
  actions: read
  contents: write

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/_tmp-verify-publish-pocket-controls-v4.yml/runs?branch=docs%2Fagent-foundation&per_page=1" --jq '.workflow_runs[0].id')
          for attempt in $(seq 1 180); do
            STATUS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '.status')
            [ "$STATUS" = completed ] && break
            sleep 10
          done
          CONCLUSION=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '.conclusion')
          FEATURE_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/feature/core-traffic" --jq '.object.sha')
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/status/pocket-v4-success" || true
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/status/pocket-v4-failure" || true
          if [ "$CONCLUSION" = success ]; then NAME=success; else NAME=failure; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/heads/status/pocket-v4-${NAME}" -f sha="$FEATURE_SHA"
