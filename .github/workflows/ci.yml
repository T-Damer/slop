name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - stable
      - "feature/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MODOKI_COMMIT: 145bae5b2dc38ac0561a2b627d726cba69a99c1f
  MODOKI_PROJECT_PATH: games/traffic-jam

jobs:
  domain-and-architecture:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Slop
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Verify domain and architecture
        run: npm run check

  modoki-web-build:
    needs: domain-and-architecture
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Slop
        uses: actions/checkout@v5

      - name: Check out pinned Modoki
        uses: actions/checkout@v5
        with:
          repository: lsgmasa33/modoki-engine
          ref: ${{ env.MODOKI_COMMIT }}
          path: .modoki-engine
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: .modoki-engine/package-lock.json

      - name: Install Modoki dependencies
        working-directory: .modoki-engine
        run: npm ci --no-audit --no-fund

      - name: Build Traffic Jam for web
        working-directory: .modoki-engine
        env:
          MODOKI_PROJECT: ${{ github.workspace }}/${{ env.MODOKI_PROJECT_PATH }}
        run: npm run build -- --target web

      - name: Verify web artifact
        run: |
          test -f "${MODOKI_PROJECT_PATH}/dist/index.html"
          du -ah "${MODOKI_PROJECT_PATH}/dist" | sort -h | tail -20

      - name: Upload browser build
        uses: actions/upload-artifact@v4
        with:
          name: traffic-jam-web-${{ github.sha }}
          path: ${{ env.MODOKI_PROJECT_PATH }}/dist
          if-no-files-found: error
          retention-days: 14
