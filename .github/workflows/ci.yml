name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - stable
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MODOKI_COMMIT: 145bae5b2dc38ac0561a2b627d726cba69a99c1f
  HUB_PROJECT_PATH: games/traffic-jam
  QUALITY_REPORT_DIR: quality-artifacts

jobs:
  quality-build-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out Slop
        uses: actions/checkout@v5

      - name: Create source snapshot
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude=.git \
            --exclude=.modoki-engine \
            --exclude=.site \
            --exclude=quality-artifacts \
            --exclude=node_modules \
            --exclude='*/node_modules' \
            --exclude='*/dist' \
            -czf "${RUNNER_TEMP}/slop-source.tar.gz" .

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: slop-source-${{ github.sha }}
          path: ${{ runner.temp }}/slop-source.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Check out pinned Modoki
        uses: actions/checkout@v5
        with:
          repository: lsgmasa33/modoki-engine
          ref: ${{ env.MODOKI_COMMIT }}
          path: .modoki-engine
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            .modoki-engine/package-lock.json
            games/traffic-jam/package-lock.json
            games/billiards/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-assets.txt

      - name: Install pinned Modoki toolchain
        working-directory: .modoki-engine
        run: npm ci --no-audit --no-fund

      - name: Install locked game-hub runtime
        working-directory: ${{ env.HUB_PROJECT_PATH }}
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install locked Pocket Club client runtime
        working-directory: games/billiards
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Pocket Club server dependencies
        working-directory: services/billiards
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Test real Colyseus clients
        working-directory: services/billiards
        run: npm test

      - name: Install locked asset toolchain
        run: python -m pip install --disable-pip-version-check -r tools/requirements-assets.txt

      - name: Reproduce source assets
        run: npm run assets:reproduce

      - name: Verify source contracts
        run: npm run check

      - name: Build the Slop game hub for web
        working-directory: .modoki-engine
        env:
          MODOKI_PROJECT: ${{ github.workspace }}/${{ env.HUB_PROJECT_PATH }}
        run: npm run build -- --target web

      - name: Stamp exact build identity
        run: node tools/build-identity.mjs write "${HUB_PROJECT_PATH}/dist" "$GITHUB_SHA"

      - name: Enforce the hub web bundle ratchet
        run: npm run web:budget

      - name: Assemble and serve the complete site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .site "${RUNNER_TEMP}/slop-site"
          mkdir -p .site "${RUNNER_TEMP}/slop-site/slop"
          cp -R "${HUB_PROJECT_PATH}/dist/." .site/
          cp -R .site/. "${RUNNER_TEMP}/slop-site/slop/"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "${RUNNER_TEMP}/slop-site" >"${RUNNER_TEMP}/slop-http.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/slop-http.pid"

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/slop/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "${RUNNER_TEMP}/slop-http.log"
          exit 1

      - name: Run game hub browser contract
        run: npm run hub:quality -- http://127.0.0.1:4173/slop/

      - name: Run Parking Jam browser contract
        run: npm run ui:quality -- http://127.0.0.1:4173/slop/

      - name: Run Junkyard Station browser contract
        run: npm run junkyard:quality -- http://127.0.0.1:4173/slop/

      - name: Run Pocket Club browser contract
        run: npm run billiards:quality -- http://127.0.0.1:4173/slop/

      - name: Stop production server
        if: always()
        shell: bash
        run: |
          if [[ -f "${RUNNER_TEMP}/slop-http.pid" ]]; then
            kill "$(cat "${RUNNER_TEMP}/slop-http.pid")" || true
          fi

      - name: Upload site and quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slop-hub-quality-${{ github.sha }}
          path: |
            .site
            ${{ env.HUB_PROJECT_PATH }}/dist
            quality-artifacts
            services/billiards/package-lock.json
          if-no-files-found: warn
          retention-days: 14
