name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - stable
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MODOKI_COMMIT: 145bae5b2dc38ac0561a2b627d726cba69a99c1f
  HUB_PROJECT_PATH: games/traffic-jam
  QUALITY_REPORT_DIR: quality-artifacts

jobs:
  quality-build-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out Slop
        uses: actions/checkout@v5

      - name: Create source snapshot
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude=.git \
            --exclude=.modoki-engine \
            --exclude=.site \
            --exclude=quality-artifacts \
            --exclude=node_modules \
            --exclude='*/node_modules' \
            --exclude='*/dist' \
            -czf "${RUNNER_TEMP}/slop-source.tar.gz" .

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: slop-source-${{ github.sha }}
          path: ${{ runner.temp }}/slop-source.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Fetch vetted CC0 island assets
        shell: bash
        run: |
          set -euo pipefail
          target="${RUNNER_TEMP}/island-assets"
          mkdir -p "${target}/models" "${target}/audio" "${target}/licenses"
          curl --fail --location --retry 3 --silent --show-error \
            https://raw.githubusercontent.com/syuhei176/ai-game-assets/main/models/environment/tree_palm.glb \
            --output "${target}/models/tree_palm.glb"
          curl --fail --location --retry 3 --silent --show-error \
            https://raw.githubusercontent.com/syuhei176/ai-game-assets/main/models/environment/tree_oak.glb \
            --output "${target}/models/tree_oak.glb"
          curl --fail --location --retry 3 --silent --show-error \
            https://raw.githubusercontent.com/syuhei176/ai-game-assets/main/models/environment/rock_large.glb \
            --output "${target}/models/rock_large.glb"
          curl --fail --location --retry 3 --silent --show-error \
            https://raw.githubusercontent.com/syuhei176/ai-game-assets/main/models/environment/building_house.glb \
            --output "${target}/models/building_house.glb"
          curl --fail --location --retry 3 --silent --show-error \
            https://raw.githubusercontent.com/masakav3/Agent-Office-Dashboard/main/frontend/vendor/kenney/character-male-a.glb \
            --output "${target}/models/character_male_a.glb"
          curl --fail --location --retry 3 --silent --show-error \
            https://raw.githubusercontent.com/Calinou/kenney-interface-sounds/master/addons/kenney_interface_sounds/click_001.wav \
            --output "${target}/audio/click_001.wav"
          curl --fail --location --retry 3 --silent --show-error \
            https://raw.githubusercontent.com/Calinou/kenney-interface-sounds/master/addons/kenney_interface_sounds/bong_001.wav \
            --output "${target}/audio/bong_001.wav"
          curl --fail --location --retry 3 --silent --show-error \
            https://raw.githubusercontent.com/Calinou/kenney-interface-sounds/master/addons/kenney_interface_sounds/back_001.wav \
            --output "${target}/audio/back_001.wav"
          curl --fail --location --retry 3 --silent --show-error \
            https://raw.githubusercontent.com/syuhei176/ai-game-assets/main/README.md \
            --output "${target}/licenses/environment-source-readme.md"
          curl --fail --location --retry 3 --silent --show-error \
            https://raw.githubusercontent.com/masakav3/Agent-Office-Dashboard/main/frontend/vendor/kenney/licenses/Mini-Characters-License.txt \
            --output "${target}/licenses/mini-characters-license.txt"
          curl --fail --location --retry 3 --silent --show-error \
            https://raw.githubusercontent.com/Calinou/kenney-interface-sounds/master/addons/kenney_interface_sounds/LICENSE.txt \
            --output "${target}/licenses/interface-sounds-license.txt"
          (cd "${target}" && sha256sum models/* audio/* licenses/* > SHA256SUMS)

      - name: Upload vetted CC0 island assets
        uses: actions/upload-artifact@v4
        with:
          name: island-assets-${{ github.sha }}
          path: ${{ runner.temp }}/island-assets
          if-no-files-found: error
          retention-days: 1

      - name: Check out pinned Modoki
        uses: actions/checkout@v5
        with:
          repository: lsgmasa33/modoki-engine
          ref: ${{ env.MODOKI_COMMIT }}
          path: .modoki-engine
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            .modoki-engine/package-lock.json
            games/traffic-jam/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-assets.txt

      - name: Install pinned Modoki toolchain
        working-directory: .modoki-engine
        run: npm ci --no-audit --no-fund

      - name: Install locked game-hub runtime
        working-directory: ${{ env.HUB_PROJECT_PATH }}
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install locked asset toolchain
        run: python -m pip install --disable-pip-version-check -r tools/requirements-assets.txt

      - name: Reproduce source assets
        run: npm run assets:reproduce

      - name: Verify source contracts
        run: npm run check

      - name: Build the Slop game hub for web
        working-directory: .modoki-engine
        env:
          MODOKI_PROJECT: ${{ github.workspace }}/${{ env.HUB_PROJECT_PATH }}
        run: npm run build -- --target web

      - name: Enforce the hub web bundle ratchet
        run: npm run web:budget

      - name: Assemble and serve the complete site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .site "${RUNNER_TEMP}/slop-site"
          mkdir -p .site "${RUNNER_TEMP}/slop-site/slop"
          cp -R "${HUB_PROJECT_PATH}/dist/." .site/
          cp -R .site/. "${RUNNER_TEMP}/slop-site/slop/"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "${RUNNER_TEMP}/slop-site" >"${RUNNER_TEMP}/slop-http.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/slop-http.pid"

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/slop/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "${RUNNER_TEMP}/slop-http.log"
          exit 1

      - name: Run game hub browser contract
        run: npm run hub:quality -- http://127.0.0.1:4173/slop/

      - name: Run Parking Jam browser contract
        run: npm run ui:quality -- http://127.0.0.1:4173/slop/

      - name: Run Junkyard Station browser contract
        run: npm run junkyard:quality -- http://127.0.0.1:4173/slop/

      - name: Stop production server
        if: always()
        shell: bash
        run: |
          if [[ -f "${RUNNER_TEMP}/slop-http.pid" ]]; then
            kill "$(cat "${RUNNER_TEMP}/slop-http.pid")" || true
          fi

      - name: Upload site and quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slop-hub-quality-${{ github.sha }}
          path: |
            .site
            ${{ env.HUB_PROJECT_PATH }}/dist
            quality-artifacts
          if-no-files-found: warn
          retention-days: 14
