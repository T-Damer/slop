name: Temporary final cleanup Pocket Club v4

on:
  push:
    branches: ["docs/agent-foundation"]
    paths: [".github/workflows/_tmp-final-clean-pocket-v4.yml"]

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Wait for verification and tag workflows
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for workflow in _tmp-verify-publish-pocket-controls-v4.yml _tmp-tag-pocket-v4-success.yml; do
            RUN_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=docs%2Fagent-foundation&per_page=1" --jq '.workflow_runs[0].id')
            for attempt in $(seq 1 180); do
              STATUS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '.status')
              [ "$STATUS" = completed ] && break
              sleep 10
            done
          done
      - name: Remove temporary refs and release PRs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/heads/status/pocket-v4-" --jq '.[].ref' | while read -r ref; do
            [ -n "$ref" ] && gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/${ref}" || true
          done
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/automation/pocket-club-refactor" || true
          gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=stable&per_page=100" --jq '.[] | select(.head.ref == "feature/core-traffic") | .number' | while read -r number; do
            [ -n "$number" ] && gh api --method PATCH "repos/${GITHUB_REPOSITORY}/pulls/${number}" -f state=closed || true
          done
      - name: Restore clean docs branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/docs/agent-foundation" -f sha=2fcf8aa1b4b30d20e05e0a82e0f59643c96ddb61 -F force=true
