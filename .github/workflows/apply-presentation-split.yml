name: Split presentation quality owners

on:
  push:
    branches:
      - feature/core-traffic
    paths:
      - .github/workflows/apply-presentation-split.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: split-presentation-quality-owners
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/core-traffic
          fetch-depth: 0
          persist-credentials: true

      - name: Extract semantic presentation owners
        shell: bash
        run: |
          set -euo pipefail

          cat > games/traffic-jam/runtime/presentation/animation-curves.ts <<'TS'
          export function dampAngle(
            current: number,
            target: number,
            amount: number,
          ): number {
            const delta = Math.atan2(Math.sin(target - current), Math.cos(target - current));
            return current + delta * amount;
          }

          export function linear(progress: number): number {
            return progress;
          }

          export function easeInCubic(progress: number): number {
            return progress * progress * progress;
          }

          export function easeOutCubic(progress: number): number {
            return 1 - Math.pow(1 - progress, 3);
          }

          export function easeInOutCubic(progress: number): number {
            return progress < 0.5
              ? 4 * progress * progress * progress
              : 1 - Math.pow(-2 * progress + 2, 3) / 2;
          }
          TS

          cat > games/traffic-jam/runtime/presentation/queue-metrics.ts <<'TS'
          import {
            trafficRules,
            type TrafficColor,
          } from '../domain/registry.ts';
          import type { TrafficState } from '../domain/types.ts';

          export function countLeadingQueueColor(
            passengers: TrafficState['passengers'],
            color: TrafficColor,
          ): number {
            let count: number = trafficRules.emptyCollectionSize;
            while (passengers[count] === color) {
              count += trafficRules.cellStep;
            }
            return count;
          }
          TS

          python3 - <<'PY'
          from pathlib import Path

          app = Path('games/traffic-jam/runtime/presentation/app.ts')
          source = app.read_text(encoding='utf-8')
          anchor = "import { ParkingJamScene } from './scene.ts';\n"
          if anchor not in source:
              raise SystemExit('app import anchor not found')
          source = source.replace(
              anchor,
              "import { countLeadingQueueColor } from './queue-metrics.ts';\n" + anchor,
          )
          source = source.replace('countLeadingGroup(', 'countLeadingQueueColor(')
          block = """\nfunction countLeadingQueueColor(passengers: TrafficState['passengers'], color: TrafficState['passengers'][number]): number {\n  let count: number = trafficRules.emptyCollectionSize;\n  while (passengers[count] === color) {\n    count += trafficRules.cellStep;\n  }\n  return count;\n}\n"""
          if block not in source:
              raise SystemExit('app queue metric block not found')
          source = source.replace(block, '\n')
          app.write_text(source, encoding='utf-8')

          scene = Path('games/traffic-jam/runtime/presentation/scene.ts')
          source = scene.read_text(encoding='utf-8')
          anchor = "import { createParkingLocationDecorations } from './locations.ts';\n"
          if anchor not in source:
              raise SystemExit('scene import anchor not found')
          source = source.replace(
              anchor,
              "import {\n  dampAngle,\n  easeInCubic,\n  easeInOutCubic,\n  easeOutCubic,\n  linear,\n} from './animation-curves.ts';\n" + anchor + "import { countLeadingQueueColor } from './queue-metrics.ts';\n",
          )
          source = source.replace('countLeadingColor(', 'countLeadingQueueColor(')
          queue_block = """\nfunction countLeadingQueueColor(passengers: TrafficState['passengers'], color: TrafficColor): number {\n  let count = trafficRules.emptyCollectionSize;\n  while (passengers[count] === color) {\n    count += trafficRules.cellStep;\n  }\n  return count;\n}\n"""
          if queue_block not in source:
              raise SystemExit('scene queue metric block not found')
          source = source.replace(queue_block, '\n')
          curve_block = """\nfunction dampAngle(current: number, target: number, amount: number): number {\n  const delta = Math.atan2(Math.sin(target - current), Math.cos(target - current));\n  return current + delta * amount;\n}\n\nfunction linear(progress: number): number {\n  return progress;\n}\n\nfunction easeInCubic(progress: number): number {\n  return progress * progress * progress;\n}\n\nfunction easeOutCubic(progress: number): number {\n  return 1 - Math.pow(1 - progress, 3);\n}\n\nfunction easeInOutCubic(progress: number): number {\n  return progress < 0.5\n    ? 4 * progress * progress * progress\n    : 1 - Math.pow(-2 * progress + 2, 3) / 2;\n}\n"""
          if curve_block not in source:
              raise SystemExit('scene curve block not found')
          source = source.replace(curve_block, '\n')
          scene.write_text(source, encoding='utf-8')
          PY

      - name: Commit split and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "slop-quality-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-presentation-split.yml
          git add -A
          git commit -m "refactor: split queue metrics and animation curves"
          git push origin HEAD:feature/core-traffic
