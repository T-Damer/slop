name: Apply personal island fix

on:
  push:
    branches:
      - feature/core-traffic
    paths:
      - .github/workflows/apply-personal-island-fix.yml

permissions:
  contents: write

concurrency:
  group: apply-personal-island-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/core-traffic
          fetch-depth: 0

      - name: Decode and apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/personal-island-patch/part* > "${RUNNER_TEMP}/personal-island-patch.b64"
          base64 --decode "${RUNNER_TEMP}/personal-island-patch.b64" > "${RUNNER_TEMP}/personal-island-patch.tar.xz"
          echo "7d063d1211baec7e75cb1cbf95606d035bceb99593bce5429cc3d55ccfe0533e  ${RUNNER_TEMP}/personal-island-patch.tar.xz" | sha256sum --check -
          tar -xJf "${RUNNER_TEMP}/personal-island-patch.tar.xz" -C .
          rm -f __invalid __invalid2__ __invalid3__ __invalid4__ __never__
          rm -f .github/workflows/inspect-youtube-playable.yml

      - name: Verify source contracts
        run: npm run check:source

      - name: Commit actual implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/personal-island-patch
          rm -f .github/workflows/apply-personal-island-fix.yml
          git config user.name "Daniil Pankov"
          git config user.email "dpancov64@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: make the personal island the default SLOP world"
          git push origin HEAD:feature/core-traffic
