name: Bootstrap game lock

on:
  push:
    branches:
      - feature/core-traffic
    paths:
      - .github/workflows/bootstrap-game-lock.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-game-lock
  cancel-in-progress: false

jobs:
  lock:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/core-traffic
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Generate exact game lockfile
        working-directory: games/traffic-jam
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "slop-quality-bot"
          git config user.email "actions@users.noreply.github.com"
          git add games/traffic-jam/package-lock.json
          git rm .github/workflows/bootstrap-game-lock.yml
          git commit -m "chore: lock Parking Jam runtime dependencies"
          git push origin HEAD:feature/core-traffic
