name: Publish stable

on:
  push:
    branches:
      - stable
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-stable
  cancel-in-progress: false

env:
  MODOKI_COMMIT: 145bae5b2dc38ac0561a2b627d726cba69a99c1f
  MODOKI_PROJECT_PATH: games/traffic-jam

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out stable
        uses: actions/checkout@v5

      - name: Check out pinned Modoki
        uses: actions/checkout@v5
        with:
          repository: lsgmasa33/modoki-engine
          ref: ${{ env.MODOKI_COMMIT }}
          path: .modoki-engine
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: .modoki-engine/package-lock.json

      - name: Verify Slop source
        run: npm run check

      - name: Install Modoki dependencies
        working-directory: .modoki-engine
        run: npm ci --no-audit --no-fund

      - name: Install game runtime dependencies
        working-directory: ${{ env.MODOKI_PROJECT_PATH }}
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Build Parking Jam for Pages
        working-directory: .modoki-engine
        env:
          MODOKI_PROJECT: ${{ github.workspace }}/${{ env.MODOKI_PROJECT_PATH }}
        run: npm run build -- --target web

      - name: Verify Pages artifact
        run: test -f "${MODOKI_PROJECT_PATH}/dist/index.html"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.MODOKI_PROJECT_PATH }}/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: stable-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    needs: deploy
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Verify rendered 3D mobile game
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$browser" ]]; then
            echo "No supported Chromium browser is installed on the runner." >&2
            exit 1
          fi

          for attempt in $(seq 1 12); do
            if curl --fail --location --silent --show-error "$PAGE_URL" >/dev/null; then
              break
            fi
            if [[ "$attempt" == "12" ]]; then
              exit 1
            fi
            sleep 5
          done

          timeout 90s "$browser" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --window-size=390,844 \
            --virtual-time-budget=14000 \
            --dump-dom \
            "$PAGE_URL" > "${RUNNER_TEMP}/parking-jam-dom.html"

          grep -q 'id="slop-parking-jam"' "${RUNNER_TEMP}/parking-jam-dom.html"
          grep -q 'Parking Jam' "${RUNNER_TEMP}/parking-jam-dom.html"
          grep -q 'parking-canvas' "${RUNNER_TEMP}/parking-jam-dom.html"

          timeout 90s "$browser" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --hide-scrollbars \
            --window-size=390,844 \
            --virtual-time-budget=14000 \
            --screenshot="${RUNNER_TEMP}/parking-jam.png" \
            "$PAGE_URL"

          test -s "${RUNNER_TEMP}/parking-jam.png"

      - name: Upload rendered smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: parking-jam-pages-smoke-${{ github.sha }}
          path: |
            ${{ runner.temp }}/parking-jam.png
            ${{ runner.temp }}/parking-jam-dom.html
          if-no-files-found: error
          retention-days: 14
