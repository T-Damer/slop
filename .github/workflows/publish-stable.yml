name: Publish stable

on:
  push:
    branches:
      - stable
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-stable
  cancel-in-progress: false

env:
  MODOKI_COMMIT: 145bae5b2dc38ac0561a2b627d726cba69a99c1f
  MODOKI_PROJECT_PATH: games/traffic-jam

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out stable
        uses: actions/checkout@v5

      - name: Check out pinned Modoki
        uses: actions/checkout@v5
        with:
          repository: lsgmasa33/modoki-engine
          ref: ${{ env.MODOKI_COMMIT }}
          path: .modoki-engine
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: .modoki-engine/package-lock.json

      - name: Verify Slop source
        run: npm run check

      - name: Install Modoki dependencies
        working-directory: .modoki-engine
        run: npm ci --no-audit --no-fund

      - name: Build Traffic Jam for Pages
        working-directory: .modoki-engine
        env:
          MODOKI_PROJECT: ${{ github.workspace }}/${{ env.MODOKI_PROJECT_PATH }}
        run: npm run build -- --target web

      - name: Verify Pages artifact
        run: test -f "${MODOKI_PROJECT_PATH}/dist/index.html"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.MODOKI_PROJECT_PATH }}/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: stable-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    needs: deploy
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Verify published HTML and entry module
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const pageUrl = process.env.PAGE_URL;
          const smokeLimits = {
            attempts: 12,
            retryDelayMs: 5_000,
          };

          if (!pageUrl) {
            throw new Error('Pages deployment did not return a URL.');
          }

          for (let attempt = 1; attempt <= smokeLimits.attempts; attempt += 1) {
            try {
              const pageResponse = await fetch(pageUrl, { redirect: 'follow' });
              if (!pageResponse.ok) {
                throw new Error(`HTML returned HTTP ${pageResponse.status}.`);
              }

              const html = await pageResponse.text();
              if (!html.toLowerCase().includes('<!doctype html')) {
                throw new Error('Published response is not an HTML document.');
              }

              const entryMatch = html.match(/<script[^>]+src="([^"]+\.js)"/i);
              if (!entryMatch?.[1]) {
                throw new Error('Published HTML has no JavaScript entry module.');
              }

              const entryUrl = new URL(entryMatch[1], pageUrl);
              const entryResponse = await fetch(entryUrl, { redirect: 'follow' });
              if (!entryResponse.ok) {
                throw new Error(`Entry module returned HTTP ${entryResponse.status}.`);
              }

              const entrySource = await entryResponse.text();
              if (entrySource.length === 0) {
                throw new Error('Entry module is empty.');
              }

              console.log(`Pages HTTP smoke passed: ${pageUrl}`);
              console.log(`Entry module: ${entryUrl}`);
              process.exit(0);
            } catch (error) {
              console.error(`Smoke attempt ${attempt} failed:`, error);
              if (attempt === smokeLimits.attempts) {
                throw error;
              }
              await new Promise((resolve) => setTimeout(resolve, smokeLimits.retryDelayMs));
            }
          }
          NODE

      - name: Verify rendered mobile browser UI
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$browser" ]]; then
            echo "No supported Chromium browser is installed on the runner." >&2
            exit 1
          fi

          timeout 60s "$browser" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --window-size=390,844 \
            --virtual-time-budget=10000 \
            --dump-dom \
            "$PAGE_URL" > "${RUNNER_TEMP}/traffic-jam-dom.html"

          grep -q 'id="slop-traffic-jam"' "${RUNNER_TEMP}/traffic-jam-dom.html"
          grep -q 'Traffic Jam' "${RUNNER_TEMP}/traffic-jam-dom.html"
          grep -q 'traffic-board' "${RUNNER_TEMP}/traffic-jam-dom.html"

          timeout 60s "$browser" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --hide-scrollbars \
            --window-size=390,844 \
            --virtual-time-budget=10000 \
            --screenshot="${RUNNER_TEMP}/traffic-jam.png" \
            "$PAGE_URL"

          test -s "${RUNNER_TEMP}/traffic-jam.png"
          echo "Rendered browser smoke passed: ${PAGE_URL}"

      - name: Upload rendered smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: traffic-jam-pages-smoke-${{ github.sha }}
          path: |
            ${{ runner.temp }}/traffic-jam.png
            ${{ runner.temp }}/traffic-jam-dom.html
          if-no-files-found: error
          retention-days: 14
