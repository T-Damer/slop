name: Publish stable

on:
  push:
    branches:
      - stable
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-stable
  cancel-in-progress: false

env:
  MODOKI_COMMIT: 145bae5b2dc38ac0561a2b627d726cba69a99c1f
  MODOKI_PROJECT_PATH: games/traffic-jam
  QUALITY_REPORT_DIR: quality-artifacts

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out stable
        uses: actions/checkout@v5

      - name: Check out pinned Modoki
        uses: actions/checkout@v5
        with:
          repository: lsgmasa33/modoki-engine
          ref: ${{ env.MODOKI_COMMIT }}
          path: .modoki-engine
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            .modoki-engine/package-lock.json
            games/traffic-jam/package-lock.json

      - name: Install pinned Modoki toolchain
        working-directory: .modoki-engine
        run: npm ci --no-audit --no-fund

      - name: Install locked game runtime
        working-directory: ${{ env.MODOKI_PROJECT_PATH }}
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify source contracts
        run: npm run check

      - name: Build Parking Jam for Pages
        working-directory: .modoki-engine
        env:
          MODOKI_PROJECT: ${{ github.workspace }}/${{ env.MODOKI_PROJECT_PATH }}
        run: npm run build -- --target web

      - name: Enforce web bundle ratchet
        run: npm run web:budget

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.MODOKI_PROJECT_PATH }}/dist

      - name: Upload build quality report
        uses: actions/upload-artifact@v4
        with:
          name: parking-jam-build-quality-${{ github.sha }}
          path: quality-artifacts
          if-no-files-found: error
          retention-days: 14

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: stable-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  browser-quality:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out stable quality harness
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Wait for Pages propagation
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            if curl --fail --location --silent "$PAGE_URL" >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Run deployed multi-viewport quality contract
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: npm run ui:quality -- "$PAGE_URL"

      - name: Upload deployed browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parking-jam-pages-quality-${{ github.sha }}
          path: quality-artifacts
          if-no-files-found: warn
          retention-days: 14
