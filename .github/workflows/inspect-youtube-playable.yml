name: Inspect YouTube playable

on:
  workflow_dispatch:
  push:
    branches:
      - feature/core-traffic
    paths:
      - .github/workflows/inspect-youtube-playable.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Inspect public playable metadata
        shell: bash
        env:
          PLAYABLE_URL: https://www.youtube.com/playables/UgkxeGp_XRn3IhN7Qj0hCfezVyWbXEjLE_Sk
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/playable"
          curl --fail --location --compressed --retry 2 \
            --user-agent 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130 Safari/537.36' \
            "${PLAYABLE_URL}" \
            --output "${RUNNER_TEMP}/playable/curl.html" || true

          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [[ -n "${browser}" ]]; then
            timeout 90s "${browser}" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --disable-dev-shm-usage \
              --window-size=1280,900 \
              --virtual-time-budget=30000 \
              --dump-dom \
              "${PLAYABLE_URL}" > "${RUNNER_TEMP}/playable/dom.html" || true
            timeout 90s "${browser}" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --disable-dev-shm-usage \
              --window-size=1280,900 \
              --virtual-time-budget=30000 \
              --screenshot="${RUNNER_TEMP}/playable/screenshot.png" \
              "${PLAYABLE_URL}" || true
          fi

          python3 - <<'PY'
          from pathlib import Path
          import html
          import re

          root = Path(__import__('os').environ['RUNNER_TEMP']) / 'playable'
          for name in ('curl.html', 'dom.html'):
              path = root / name
              if not path.exists():
                  continue
              text = path.read_text(errors='replace')
              print(f'--- {name} bytes={len(text)}')
              patterns = [
                  r'<title>(.*?)</title>',
                  r'<meta[^>]+property=["\']og:title["\'][^>]+content=["\'](.*?)["\']',
                  r'<meta[^>]+name=["\']title["\'][^>]+content=["\'](.*?)["\']',
                  r'"title":"([^"]{1,160})"',
                  r'"gameTitle":"([^"]{1,160})"',
                  r'"playableTitle":"([^"]{1,160})"',
              ]
              seen = set()
              for pattern in patterns:
                  for value in re.findall(pattern, text, re.I | re.S):
                      cleaned = html.unescape(re.sub(r'\\u([0-9a-fA-F]{4})', lambda m: chr(int(m.group(1), 16)), value))
                      cleaned = re.sub(r'\s+', ' ', cleaned).strip()
                      if cleaned and cleaned not in seen:
                          seen.add(cleaned)
                          print(cleaned[:300])
          PY

      - name: Upload inspection evidence
        uses: actions/upload-artifact@v4
        with:
          name: youtube-playable-inspection
          path: ${{ runner.temp }}/playable
          if-no-files-found: warn
          retention-days: 1
