name: Apply strict quality gates patch

on:
  push:
    branches:
      - feature/core-traffic
    paths:
      - .github/workflows/apply-quality-patch.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-strict-quality-gates
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/core-traffic
          fetch-depth: 0
          persist-credentials: true

      - name: Decode staged patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import glob
          import hashlib
          import pathlib

          parts = [pathlib.Path(path) for path in sorted(glob.glob('.quality-patch/part-*'))]
          if not parts:
              raise SystemExit('No staged quality patch parts found.')
          encoded = ''.join(
              ''.join(part.read_text(encoding='utf-8').split())
              for part in parts
          )
          decoded = base64.b64decode(encoded, validate=True)
          print(f'parts: {len(parts)}')
          print(f'encoded bytes: {len(encoded)}')
          print(f'archive bytes: {len(decoded)}')
          print(f'archive sha256: {hashlib.sha256(decoded).hexdigest()}')
          pathlib.Path('/tmp/quality-patch.tar.gz').write_bytes(decoded)
          PY

          tar -tzf /tmp/quality-patch.tar.gz
          tar -xzf /tmp/quality-patch.tar.gz

      - name: Verify expected quality files
        shell: bash
        run: |
          set -euo pipefail
          test -f quality/quality-contract.json
          test -f quality/debt.json
          test -f quality/generation-policy.md
          test -f tools/check-quality.mjs
          test -f tools/validate-assets.mjs
          test -f tools/check-build-budget.mjs
          test -f tsconfig.strict.json

      - name: Commit applied patch and remove staging files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "slop-quality-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm -r .quality-patch
          git rm .github/workflows/apply-quality-patch.yml
          git add -A

          if git diff --cached --quiet; then
            echo "No quality changes to commit."
            exit 0
          fi

          git commit -m "quality: add strict code, asset, runtime, and UI gates"
          git push origin HEAD:feature/core-traffic
