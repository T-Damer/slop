name: Fetch island assets

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download official CC0 Kenney packs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/kenney"
          curl --fail --location --retry 3 --silent --show-error \
            https://kenney.nl/media/pages/assets/nature-kit/37ac38a37b-1677698939/kenney_nature-kit.zip \
            --output "${RUNNER_TEMP}/kenney/nature-kit.zip"
          curl --fail --location --retry 3 --silent --show-error \
            https://kenney.nl/media/pages/assets/blocky-characters/8369c0cf30-1749547469/kenney_blocky-characters_20.zip \
            --output "${RUNNER_TEMP}/kenney/blocky-characters.zip"
          curl --fail --location --retry 3 --silent --show-error \
            https://kenney.nl/media/pages/assets/interface-sounds/fa43c1dd4d-1677589452/kenney_interface-sounds.zip \
            --output "${RUNNER_TEMP}/kenney/interface-sounds.zip"
          unzip -l "${RUNNER_TEMP}/kenney/nature-kit.zip" > "${RUNNER_TEMP}/kenney/nature-kit.manifest.txt"
          unzip -l "${RUNNER_TEMP}/kenney/blocky-characters.zip" > "${RUNNER_TEMP}/kenney/blocky-characters.manifest.txt"
          unzip -l "${RUNNER_TEMP}/kenney/interface-sounds.zip" > "${RUNNER_TEMP}/kenney/interface-sounds.manifest.txt"
          (cd "${RUNNER_TEMP}/kenney" && sha256sum *.zip > SHA256SUMS)

      - name: Upload official Kenney packs
        uses: actions/upload-artifact@v4
        with:
          name: official-kenney-island-packs-${{ github.sha }}
          path: ${{ runner.temp }}/kenney
          if-no-files-found: error
          retention-days: 1
