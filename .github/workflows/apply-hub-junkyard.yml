name: Apply game hub and junkyard base

on:
  push:
    branches:
      - feature/core-traffic
    paths:
      - .github/workflows/apply-hub-junkyard.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/core-traffic
          fetch-depth: 0

      - name: Apply staged implementation
        shell: bash
        run: |
          set -euo pipefail
          cat .github/payload/hub-junkyard-*.b64 | base64 --decode | tar -xzf -
          rm -rf .github/payload
          rm -f .github/workflows/apply-hub-junkyard.yml

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "slop-quality-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: add game hub and reusable tycoon world"
          git push origin HEAD:feature/core-traffic
