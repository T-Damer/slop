name: Apply Cozy Pool slice

on:
  push:
    branches:
      - feature/core-traffic
    paths:
      - .github/workflows/apply-cozy-pool.yml

permissions:
  contents: write

concurrency:
  group: apply-cozy-pool
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/core-traffic
          fetch-depth: 0

      - name: Verify and apply authored patch
        shell: bash
        run: |
          set -euo pipefail
          echo "f7773ebdfadeeea36b11bc29364b1923a211312547314de143bafb2118664164  .github/cozy-pool-patch.tar.xz" | sha256sum --check
          tar -xJf .github/cozy-pool-patch.tar.xz
          rm -f .github/cozy-pool-patch.tar.xz .github/workflows/apply-cozy-pool.yml

      - name: Verify source contracts
        shell: bash
        run: |
          set -euo pipefail
          npm test
          node tools/check-change-contract.mjs
          node tools/check-architecture.mjs
          node tools/check-code-quality.mjs
          node tools/check-assets.mjs
          node --check tools/check-billiards-quality.mjs
          git diff --check

      - name: Commit Cozy Pool implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add Cozy Pool billiards to the island hub"
          git push origin HEAD:feature/core-traffic
